name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package archive
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $dir = "dubrust-$version-windows-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/dubrust.exe $dir/
          Copy-Item README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-LICENSES.md $dir/
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
          "ARCHIVE=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          body: |
            **DubRust ${{ github.ref_name }}** - dubbing and voice-over studio written in Rust.

            Download the archive below, unpack it, make sure `ffmpeg` and `ffprobe` are in `PATH`,
            and run `dubrust.exe`. Model weights for HT-Demucs are not bundled: the app downloads
            them on demand only if you enable clean-BGM separation.

            See `CHANGELOG.md` for the full list of changes.
