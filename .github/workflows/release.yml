name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (without the leading v)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 installer and portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer, portable archive and checksums
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dubrust-${{ steps.version.outputs.value }}-windows-x64
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
